<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiteForge – Leads → Demo websites</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .lp{display:grid;grid-template-columns:minmax(560px,1fr) 1fr;height:100vh}
  .lp-left{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
  .lp-top{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
  .lp-top .row input{flex:1}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
  .filters select,.filters input[type=search]{width:auto}
  .filters label{display:flex;gap:6px;align-items:center}.filters input[type=checkbox]{width:auto}
  .tbl-wrap{overflow:auto;flex:1}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);z-index:1}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr.cur td{background:var(--soft)}
  td input[type=checkbox],th input[type=checkbox]{width:auto}
  .nm{font-weight:600}.sub{color:var(--muted);font-size:12px}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line);margin-right:4px}
  .st{font-size:12px;font-weight:600;white-space:nowrap}.st.ok{color:#16a34a}.st.err{color:var(--danger)}.st.run{color:var(--pri)}
  .acts{display:flex;gap:5px;flex-wrap:wrap}.acts a,.acts button{padding:5px 9px;font-size:12px;border-radius:7px;text-decoration:none}
  .acts a{border:1px solid var(--line);color:var(--text)}
  .bulk{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
  .bar{flex:1;height:8px;background:var(--bg);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),#06b6d4);transition:width .4s}
  .lp-right{display:flex;flex-direction:column;min-height:0}
  .lp-right .toolbar span{font-weight:600}
  .runlog{max-height:150px;overflow:auto;font:12px ui-monospace,monospace;color:var(--muted);padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  @media (max-width:1100px){.lp{grid-template-columns:1fr;height:auto}.lp-right{height:90vh}}
</style>
</head>
<body>
<div class="lp">
  <section class="lp-left">
    <div class="brandbar">
      <div class="mark">◆</div>
      <div><strong>Leads → Demo websites</strong><small>Load your sheet, build a unique site for every lead</small></div>
      <div class="bar-actions"><a class="ghost sm" href="/" style="text-decoration:none;display:inline-block">Single site editor</a></div>
    </div>
    <div class="lp-top">
      <div class="row">
        <input id="sheetUrl" placeholder="Google Sheet link (Share → Anyone with the link → Viewer)">
        <button id="btnLoad">Load leads</button>
        <label class="ghost sm filebtn">CSV<input type="file" id="csvFile" accept=".csv,text/csv" hidden></label>
      </div>
      <div class="filters">
        <label><input type="checkbox" id="fNoSite" checked> Only leads without a website</label>
        <select id="fCat"><option value="">All types</option></select>
        <input type="search" id="fSearch" placeholder="Search…">
        <span class="sub" id="count"></span>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th><input type="checkbox" id="selAll"></th><th>Business</th><th>Rating</th><th>Phone</th><th>Demo</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">Paste your Google Sheet link above and click <b>Load leads</b>.</td></tr></tbody>
      </table>
    </div>
    <div class="bulk">
      <button id="btnBuildSel" disabled>⚡ Build selected</button>
      <button class="ghost" id="btnStop" hidden>Stop</button>
      <div class="bar"><i id="barFill"></i></div>
      <span class="sub" id="barText"></span>
      <button class="ghost sm" id="btnExport" title="Download the leads with their demo links">Export CSV</button>
    </div>
  </section>

  <section class="lp-right stage">
    <div class="toolbar">
      <span id="pvTitle">Preview</span>
      <div class="seg" id="device">
        <button data-v="100%" class="on" title="Desktop">🖥</button>
        <button data-v="390px" title="Mobile">📱</button>
      </div>
      <div class="spacer"></div>
      <a class="ghost sm" id="pvOpen" target="_blank" hidden style="text-decoration:none">Open ↗</a>
      <a class="ghost sm" id="pvEdit" hidden style="text-decoration:none">Edit</a>
      <a class="sm" id="pvDownload" hidden style="text-decoration:none;background:var(--pri);color:#fff;border-radius:8px;padding:7px 12px;font-weight:600">⬇ Download</a>
    </div>
    <div class="runlog" id="runlog" hidden></div>
    <div class="canvas"><div class="frame-wrap" id="frameWrap"><iframe id="preview" title="Preview"></iframe></div></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script src="leads.js"></script>
</body>
</html>
